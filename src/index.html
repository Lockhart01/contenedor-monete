<!DOCTYPE html>
<html>
<head>
    <title>Special Gift</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #000;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow:
                0 0 10px rgba(255,255,255,0.9),
                0 0 20px rgba(0, 255, 255, 0.7),
                0 0 30px rgba(0, 128, 255, 0.6),
                0 0 40px rgba(0, 128, 255, 0.4);
            margin: 0 0 20px;
            font-family: Arial, sans-serif;
        }

        p {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            text-shadow:
                0 0 8px rgba(255,255,255,0.8),
                0 0 16px rgba(0, 255, 255, 0.5),
                0 0 24px rgba(0, 128, 255, 0.4);
            margin: 0 0 30px;
        }

        img {
            display: block;
            width: calc(100px * 6);
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Aqui no hay nada!!!</h1>
    <p>Pero mira a este monete bailar:</p>
    <img src="monkey.gif" alt="Monkey Dancing">
</body>
</html>
